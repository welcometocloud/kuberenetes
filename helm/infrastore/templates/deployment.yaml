apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "infrastore.fullname" . }}
  labels:
    {{- include "infrastore.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "infrastore.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "infrastore.selectorLabels" . | nindent 8 }}

    spec:

      serviceAccountName: {{ .Values.serviceAccount.name | default (include "infrastore.fullname" .) }}

      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: infrastore

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DJANGO_SUPERUSER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secret" (include "infrastore.fullname" .) }}
                  key: DJANGO_SUPERUSER_USERNAME

            - name: DJANGO_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secret" (include "infrastore.fullname" .) }}
                  key: DJANGO_SUPERUSER_PASSWORD
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          {{- if .Values.probes.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.storage.media.enabled }}
            - name: media-storage
              mountPath: {{ .Values.storage.media.mountPath }}
            {{- end }}

            {{- if .Values.storage.database.enabled }}
            - name: database-storage
              mountPath: {{ .Values.storage.database.mountPath }}
            {{- end }}

      volumes:
        {{- if .Values.storage.media.enabled }}
        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ include "infrastore.fullname" . }}-media
        {{- end }}

        {{- if .Values.storage.database.enabled }}
        - name: database-storage
          persistentVolumeClaim:
            claimName: {{ include "infrastore.fullname" . }}-database
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
