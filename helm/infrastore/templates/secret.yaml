{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "infrastore.fullname" .) }}
  labels:
    {{- include "infrastore.labels" . | nindent 4 }}

type: Opaque

stringData:
  DJANGO_SUPERUSER_USERNAME: {{ required "credentials.username is required" .Values.credentials.username | quote }}
  DJANGO_SUPERUSER_PASSWORD: {{ required "credentials.password is required" .Values.credentials.password | quote }}
{{- end }}
