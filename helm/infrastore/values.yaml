replicaCount: 1

image:
  repository: infratestchallenge/infrastore
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

existingSecret: infrastore-secret

credentials:
  username: admin
  password: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

serviceAccount:
  create: true
  name: ""
  automount: false

storage:
  media:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    mountPath: /app/media
    storageClass: ""

  database:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    mountPath: /app/db
    storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi

  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 30

probes:
  enabled: true
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

ingress:
  enabled: false
  className: nginx
  host: infrastore.local
  path: /
  pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}
